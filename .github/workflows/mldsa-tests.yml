name: ML-DSA E2E Tests

on:
  push:
    branches: [ main, master, claude/kaspa-rust-quantum-* ]
    paths:
      - 'crypto/mldsa/**'
      - 'crypto/txscript/**'
      - 'crypto/addresses/**'
      - 'testing/integration/**'
      - 'tests/**'
      - 'Dockerfile.test'
      - 'docker-compose.test.yml'
      - '.github/workflows/mldsa-tests.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'crypto/mldsa/**'
      - 'crypto/txscript/**'
      - 'crypto/addresses/**'
      - 'testing/integration/**'
      - 'tests/**'
  workflow_dispatch:

jobs:
  # Job 1: Unit Tests (fast)
  unit-tests:
    name: ML-DSA Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: 1.85.0
          profile: minimal
          override: true

      - name: Cache cargo registry
        uses: actions/cache@v3
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v3
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo build
        uses: actions/cache@v3
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}

      - name: Run ML-DSA unit tests
        run: cargo test -p kaspa-mldsa --release

      - name: Run wallet keys tests
        run: cargo test -p kaspa-wallet-keys --release

  # Job 2: Integration Tests (medium speed)
  integration-tests:
    name: ML-DSA Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: unit-tests

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: 1.85.0
          profile: minimal
          override: true

      - name: Cache cargo
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Run txscript integration tests
        run: cargo test -p kaspa-txscript --release integration_mldsa -- --ignored --nocapture

      - name: Run airgap offline delegation integration test
        run: cargo test -p kaspa-testing-integration airgap_mldsa -- --nocapture

  # Job 3: E2E Tests in Docker (comprehensive)
  e2e-docker-tests:
    name: ML-DSA E2E Tests (Docker)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: integration-tests

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v3
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Build Docker test image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.test
          push: false
          load: true
          tags: kaspa-mldsa-test:latest
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max

      - name: Run E2E Comprehensive Tests
        run: |
          docker run --rm kaspa-mldsa-test \
            cargo test -p kaspa-txscript --release \
            e2e_comprehensive \
            -- --ignored --nocapture

      - name: Run ML-DSA Transaction E2E Tests
        run: |
          docker run --rm kaspa-mldsa-test \
            cargo test -p kaspa-txscript --release \
            mldsa_transactions_e2e \
            -- --ignored --nocapture --test-threads=1

      - name: Move cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

  # Job 4: Test Results Summary
  test-summary:
    name: Test Results Summary
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests, e2e-docker-tests]
    if: always()

    steps:
      - name: Check test results
        run: |
          echo "## 🧪 ML-DSA Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ needs.unit-tests.result }}" == "success" ]; then
            echo "✅ **Unit Tests**: Passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Unit Tests**: Failed" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${{ needs.integration-tests.result }}" == "success" ]; then
            echo "✅ **Integration Tests**: Passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Integration Tests**: Failed" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${{ needs.e2e-docker-tests.result }}" == "success" ]; then
            echo "✅ **E2E Tests (Docker)**: Passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **E2E Tests (Docker)**: Failed" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY

      - name: Fail if any test failed
        if: needs.unit-tests.result != 'success' || needs.integration-tests.result != 'success' || needs.e2e-docker-tests.result != 'success'
        run: exit 1
