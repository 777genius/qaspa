name: kaspa_wallet
repository: https://github.com/user/qaspa

packages:
  - apps/*
  - packages/core/*
  - packages/features/**
  - packages/ui/*
  - packages/shared/*

command:
  bootstrap:
    runPubGetInParallel: true
    usePubspecOverrides: false

  version:
    linkToCommits: true
    workspaceChangelog: true

scripts:
  analyze:
    run: melos exec -- dart analyze .
    description: Analyze all packages

  test:
    run: melos exec -- flutter test
    description: Run tests in all packages
    packageFilters:
      dirExists: test

  test:coverage:
    run: melos exec -- flutter test --coverage
    description: Run tests with coverage
    packageFilters:
      dirExists: test

  build:runner:
    run: melos exec -- dart run build_runner build --delete-conflicting-outputs
    description: Run build_runner in all packages
    packageFilters:
      dependsOn: build_runner

  gen:freezed:
    run: melos exec -- dart run build_runner build --delete-conflicting-outputs
    description: Generate Freezed code
    packageFilters:
      dependsOn: freezed

  gen:mobx:
    run: melos exec -- dart run build_runner build --delete-conflicting-outputs
    description: Generate MobX code
    packageFilters:
      dependsOn: mobx_codegen

  gen:drift:
    run: melos exec -- dart run build_runner build --delete-conflicting-outputs
    description: Generate Drift code
    packageFilters:
      dependsOn: drift_dev

  clean:
    run: melos exec -- flutter clean
    description: Clean all packages

  format:
    run: melos exec -- dart format .
    description: Format all packages

  rust:build:android:
    run: |
      cd packages/core/wallet_rust_bridge/rust
      cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 build --release
    description: Build Rust for Android
    packageFilters:
      scope: wallet_rust_bridge

  rust:build:ios:
    run: |
      cd packages/core/wallet_rust_bridge/rust
      cargo build --release --target aarch64-apple-ios
    description: Build Rust for iOS
    packageFilters:
      scope: wallet_rust_bridge

  rust:build:macos:
    run: |
      cd packages/core/wallet_rust_bridge/rust
      cargo build --release --target aarch64-apple-darwin
      cargo build --release --target x86_64-apple-darwin
    description: Build Rust for macOS
    packageFilters:
      scope: wallet_rust_bridge

  rust:build:wasm:
    run: |
      cd packages/core/wallet_rust_bridge/rust
      wasm-pack build --target web --out-dir ../web
    description: Build Rust WASM
    packageFilters:
      scope: wallet_rust_bridge

  rust:build:all:
    run: |
      melos run rust:build:android
      melos run rust:build:ios
      melos run rust:build:macos
      melos run rust:build:wasm
    description: Build all Rust targets

  module:graph:
    run: dart run packages/tools/module_visualizer/bin/visualize.dart
    description: Generate module dependency graph

  test:modules:
    run: melos exec -- flutter test test/module/
    description: Run module tests
    packageFilters:
      dependsOn: modularity_test
