name: dag_data
description: Data layer for DAG visualization - API clients, WebSocket, repository implementation, caching
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.8.0

dependencies:
  dag_domain:
    path: ../dag_domain

  # HTTP & WebSocket
  http: ^1.6.0
  web_socket_channel: ^3.0.3

  # Injectable stack
  injectable: ^2.7.1
  get_it: ^8.0.3

  # JSON
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0

dev_dependencies:
  build_runner: ^2.4.15
  injectable_generator: ^2.6.2
  freezed: ^3.0.6
  json_serializable: ^6.9.4
